[package]
name = "pdfraw"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Layout-preserving PDF text extraction in pure Rust (pdfplumber-inspired)"
repository = "https://github.com/joacominatel/pdfraw"
homepage = "https://github.com/joacominatel/pdfraw"
documentation = "https://docs.rs/pdfraw"
readme = "README.md"
keywords = ["pdf", "extraction", "text", "layout", "invoice"]
categories = ["text-processing", "parsing"]
exclude = [
    "docs/.obsidian/*",
    ".agents/",
    ".claude/",
    "skills-lock.json",
]

[lib]
name = "pdfraw"
path = "src/lib.rs"

# Declared explicitly rather than auto-discovered, so the CLI is a deliberate
# target. Library consumers never build it — Cargo does not compile a
# dependency's binaries.
[[bin]]
name = "pdfraw"
path = "src/bin/pdfraw.rs"

[dependencies]
lopdf       = { version = "0.44", default-features = false }
thiserror   = "2"
compact_str = "0.10"
encoding_rs = "0.8"
log         = "0.4"

serde  = { version = "1", features = ["derive"], optional = true }
rayon  = { version = "1", optional = true }

[dev-dependencies]
insta     = { version = "1", features = ["yaml"] }
printpdf  = "0.7"
env_logger = "0.11"

[features]
default  = []
serde    = ["dep:serde", "compact_str/serde"]
parallel = ["dep:rayon"]
ocr      = []

[lints.rust]
missing_docs = "deny"
unsafe_code  = "forbid"

[lints.clippy]
redundant_clone = "warn"
large_enum_variant = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
